name: Release to HACS

on:
  release:
    # created: draft release; published/prereleased: when released so the asset stays current
    types: [created, published, prereleased]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          WORKDIR="$(mktemp -d)"
          cp -r custom_components "$WORKDIR/"
          MANIFEST="$WORKDIR/custom_components/elektra_verve/manifest.json"
          export MANIFEST VERSION
          python -c "import json, os; m=os.environ['MANIFEST']; v=os.environ['VERSION']; data=json.load(open(m)); data['version']=v; json.dump(data, open(m,'w'), indent=2); open(m,'a').write('\n')"
          cd "$WORKDIR"
          zip -r elektra_verve.zip custom_components -x "*.pyc" "*__pycache__*"
          mv elektra_verve.zip "$GITHUB_WORKSPACE/"

      - name: Upload release asset (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" elektra_verve.zip --clobber
